<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TAKI</title>
  <meta name="description" content="Play TAKI, the Israeli card game, against the computer in your browser.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1 class="logo">TAKI</h1>
    <button id="new-game" class="btn btn-ghost" type="button">New game</button>
  </header>

  <main class="table">
    <section class="seat seat-cpu" aria-label="Computer">
      <div class="seat-label">
        <span class="name">Computer</span>
        <span id="cpu-count" class="count"></span>
        <span id="cpu-last" class="badge" hidden>Last card!</span>
      </div>
      <div id="cpu-hand" class="hand hand-backs"></div>
    </section>

    <section class="center" aria-label="Piles">
      <div class="pile">
        <button id="draw-pile" class="card card-back" type="button" aria-label="Draw pile"></button>
        <span id="draw-label" class="pile-label"></span>
      </div>
      <div class="pile">
        <div id="discard" class="discard" aria-live="polite"></div>
        <span id="color-label" class="pile-label"></span>
      </div>
    </section>

    <div id="banner" class="banner" role="status"></div>

    <section class="seat seat-human" aria-label="Your hand">
      <div class="controls">
        <button id="last-card" class="btn" type="button">Last card!</button>
        <button id="close-taki" class="btn btn-accent" type="button" hidden>Close TAKI</button>
      </div>
      <div id="human-hand" class="hand"></div>
      <p id="hint" class="hint" aria-live="polite"></p>
    </section>
  </main>

  <details class="log">
    <summary>Game log</summary>
    <ol id="log" reversed></ol>
  </details>

  <dialog id="color-picker" class="dialog">
    <form method="dialog">
      <h2>Choose a color</h2>
      <div class="swatches">
        <button value="red" class="swatch c-red">Red</button>
        <button value="green" class="swatch c-green">Green</button>
        <button value="blue" class="swatch c-blue">Blue</button>
        <button value="yellow" class="swatch c-yellow">Yellow</button>
      </div>
    </form>
  </dialog>

  <dialog id="game-over" class="dialog">
    <form method="dialog">
      <h2 id="game-over-title"></h2>
      <button value="again" class="btn btn-accent">Play again</button>
    </form>
  </dialog>

  <script src="taki.js"></script>
  <script src="ui.js"></script>
</body>
</html>
